<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none" role="img" aria-label="Animated mint to violet divider">
  <defs>
    <linearGradient id="line"><stop stop-color="#5EF5D0" stop-opacity="0"/><stop offset=".25" stop-color="#5EF5D0"/><stop offset=".75" stop-color="#C49BFF"/><stop offset="1" stop-color="#C49BFF" stop-opacity="0"/></linearGradient>
    <style>
      .signal { animation: move 12s ease-in-out infinite; }
      @keyframes move { 0%, 100% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } 50% { transform: translateX(1040px); } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; opacity: 0; } }
    </style>
  </defs>
  <path d="M0 12H1200" stroke="url(#line)" stroke-opacity=".35"/>
  <path class="signal" d="M0 12H160" stroke="url(#line)" stroke-width="2"/>
</svg>
